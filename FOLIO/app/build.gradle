plugins { id 'com.android.application' }
android {
    namespace 'org.folio.crema'
    compileSdk 33
    defaultConfig {
        applicationId 'org.folio.crema.philosophia'
        minSdk 19
        targetSdk 19
        versionCode 10
        versionName '1.0.0-philosophia'
    }
    aaptOptions { noCompress 'lexpack', 'ttf' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs { debug { enableV1Signing true; enableV2Signing true } }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    lint { abortOnError false }
}
