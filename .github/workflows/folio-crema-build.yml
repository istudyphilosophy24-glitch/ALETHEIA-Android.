name: FOLIO Crema APK (Android 4.4)
on:
  push:
    branches: [folio-crema-reader]
    paths:
      - 'FOLIO/**'
      - '.github/workflows/folio-crema-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK 33
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.2'
      - name: Setup Gradle 7.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'
      - name: Compile APK for API 19
        run: gradle -p FOLIO --no-daemon --stacktrace assembleDebug
      - name: Verify APK minimum API
        run: |
          ls -lh FOLIO/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/33.0.2/aapt dump badging FOLIO/app/build/outputs/apk/debug/app-debug.apk | head -8
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FOLIO-Crema-Android4.4-APK
          path: FOLIO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
