name: Build ALETHEIA Native APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Compile APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout native source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform
        run: |
          echo "Android SDK: $ANDROID_HOME"
          echo "y" | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: ALETHEIA-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
