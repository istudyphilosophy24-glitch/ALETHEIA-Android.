plugins { id 'com.android.application' }
android {
    namespace 'org.philosophia.ereader'
    compileSdk 34
    defaultConfig {
        applicationId 'org.philosophia.grande'
        minSdk 19
        targetSdk 19
        versionCode 20
        versionName '2.0-embedded'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
